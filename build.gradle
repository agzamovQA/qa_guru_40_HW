plugins {
    id 'java'
    id 'io.qameta.allure' version "3.0.2"
}

group = 'org.example'
version = '1.0-SNAPSHOT'

allure {
    report { // секция репорта
        version.set("2.19.0")
    }
    adapter {
        aspectjWeaver.set(true)
        frameworks {
            junit5 {
                adapterVersion.set("2.19.0")
            }
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.codeborne:selenide:7.9.4'
    testImplementation "com.github.javafaker:javafaker:1.0.2"
    testImplementation 'com.codeborne:pdf-test:2.1.0'
    testImplementation 'com.codeborne:xls-test:1.7.2'
    testImplementation 'org.apache.poi:poi:5.2.3'
    testImplementation 'com.opencsv:opencsv:5.10'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.13.1'
    testImplementation "io.qameta.allure:allure-selenide:2.19.0"
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()

    testLogging {
        lifecycle {
            events "started", "skipped", "failed", "standard_error", "standard_out"
            exceptionFormat "short"
        }
    }
}