plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.codeborne:selenide:7.9.4'
    testImplementation "com.github.javafaker:javafaker:1.0.2"
    testImplementation "com.codeborne:pdf-test:1.5.0"
    testImplementation "com.codeborne:xls-test:1.4.3"
    testImplementation "com.opencsv:opencsv:5.12.0"
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.21.1'
    testImplementation 'org.apache.poi:poi-ooxml:5.5.1'
}

// Указываем, какую кодировку выбрать
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}


test {
    useJUnitPlatform()
}